name: Deploy Application
 
on:
  push:
    branches:
      - deployment
 
jobs:
  deploy:
    runs-on: self-hosted
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Build Docker images
        run: docker compose -f myfastapiapp/docker-compose.yml build
 
      - name: Start application
        run: docker compose -f myfastapiapp/docker-compose.yml up -d
 
      - name: Check containers
        run: docker compose -f myfastapiapp/docker-compose.yml ps
